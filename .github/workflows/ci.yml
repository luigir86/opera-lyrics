name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the code: no other permission is needed.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # Catches a mistake in the manifest or in Gradle before it reaches a
      # phone. Debug: a release build needs the upload key (see store/README.md).
      - run: flutter build apk --debug
